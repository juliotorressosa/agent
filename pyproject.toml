[project]
name = "agent"
version = "0.1.0"
description = "This is an agent application for practicing langchain, FastAPI, and Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.1",
    "fastapi>=0.131.0",
    "fastmcp>=3.0.2",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.4",
    "langchain-chroma>=0.1.2",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "mcp[cli]>=1.26.0",
    "ollama>=0.6.1",
    "pydantic>=2.12.5",
    "pypdf>=6.7.3",
    "pyqt6>=6.10.2",
    "python-dotenv>=1.2.1",
    "streamlit>=1.54.0",
    "uvicorn>=0.41.0",
]
